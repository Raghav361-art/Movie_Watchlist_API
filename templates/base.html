<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Watchlist{% endblock %}</title>
  <!-- Set the theme before first paint so there's no flash of the wrong palette. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("watchlist_theme");
        if (saved && saved !== "auto") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {
        // Storage unavailable — fall back to the OS's prefers-color-scheme.
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Change theme">
    <span id="theme-toggle-icon">☾</span>
    <span id="theme-toggle-label">Dark</span>
  </button>

  <div id="toast" class="toast"></div>
  <script src="{{ url_for('static', path='js/api.js') }}"></script>
  <script src="{{ url_for('static', path='js/theme.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
